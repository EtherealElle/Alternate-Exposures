# Pages CMS configuration (https://pagescms.org)
# Open the site in the editor at https://app.pagescms.org

media:
  input: images/gallery
  output: /images/gallery
  extensions: [jpg, jpeg, png, webp]
  rename: safe

content:
  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: name
        label: Project name
        type: string
        required: true
        description: 'Shown in the gallery list, e.g. "Lil Example — ''Song Title''" or "Brand Name — Fall 2026".'
      - name: client
        label: Artist or brand
        type: string
        description: Optional. Shown under the project name.
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: musicvideo
              label: Music video
            - name: artist
              label: Artist visuals (cover art, press)
            - name: merch
              label: Merch drop
            - name: lookbook
              label: Lookbook / campaign
            - name: live
              label: Live show / event
      - name: date
        label: When
        type: string
        description: Optional, e.g. "March 2026" or just "2026".
      - name: cover
        label: Cover photo
        type: image
        required: true
        description: The one image that represents this project in the gallery list. For a music video, use a still from it.
      - name: description
        label: Description
        type: text
        description: A short paragraph about the project — the idea, the locations, what was delivered. Shown when someone opens the project.
      - name: videos
        label: Video links
        type: string
        list: true
        description: Paste YouTube or Vimeo links (Shorts work too). Add one per video. Leave empty for photo-only projects.
      - name: photos
        label: Photos
        type: image
        options:
          multiple:
            max: 40
        description: All the photos for this project. JPG, PNG or WebP only (iPhone HEIC photos need to be exported as JPG first).
      - name: featured
        label: Show on homepage
        type: boolean
        description: Tick up to 3 projects for the "Selected work" section on the home page.
